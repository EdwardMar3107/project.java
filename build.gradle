plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
}

group = 'by.ezer'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Hibernate ORM 7.2 (включает JPA API)
    implementation 'org.hibernate.orm:hibernate-core'

    // Явно JPA API (на случай проблем с импортами в IDE)
    implementation 'jakarta.persistence:jakarta.persistence-api'

    // PostgreSQL драйвер
    runtimeOnly 'org.postgresql:postgresql'

    // H2 база в памяти — для быстрого тестирования (очень удобно!)
    runtimeOnly 'com.h2database:h2'

    // Servlet API
    implementation 'jakarta.servlet:jakarta.servlet-api'

    // Логирование
    implementation 'ch.qos.logback:logback-classic'

    //redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Dotenv для .env файлов (если захочешь вынести credentials)
    implementation 'io.github.cdimascio:dotenv-java:3.0.2'

    //Spring boot + Security
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    //JWT
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    //MapStruct
    compileOnly 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Тесты
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'by.ezer.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"  // ← ВОТ ЭТО КРИТИЧЕСКОЕ
}