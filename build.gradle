plugins {
    id 'java'
    id 'application'
}

group = 'by.ezer'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Hibernate ORM 7.2 (включает JPA API)
    implementation 'org.hibernate.orm:hibernate-core:7.2.0.Final'

    // Явно JPA API (на случай проблем с импортами в IDE)
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // PostgreSQL драйвер
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // H2 база в памяти — для быстрого тестирования (очень удобно!)
    runtimeOnly 'com.h2database:h2:2.3.230'

    // Servlet API
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    // Логирование
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.16'


    // Dotenv для .env файлов (если захочешь вынести credentials)
    implementation 'io.github.cdimascio:dotenv-java:3.0.2'

    // Jackson для JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    //Spring Core + Context
    implementation 'org.springframework:spring-context:7.0.2'
    implementation 'org.springframework:spring-orm:7.0.2' // для JpaTransactionManager
    implementation 'org.springframework:spring-tx:7.0.2' // даёт @EnableTransactionManagement
    implementation 'org.springframework:spring-webmvc:7.0.2' // MVC

    //Tomcat
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.15'
    implementation 'org.apache.tomcat.embed:tomcat-embed-el:11.0.15'  // для EL-выражений
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.15'  // если нужен WebSocket

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    //MapStruct
    compileOnly 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Тесты
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'by.ezer.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"  // ← ВОТ ЭТО КРИТИЧЕСКОЕ
}